version: '3.8'

services:

  mysql:
    image: mysql:8
    container_name: looking-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lookingNEWWW
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: abderrazekchamekh/looking-backend:v1
    container_name: looking-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      # Database
      DB_URL: jdbc:mysql://mysql:3306/lookingNEWWW?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

      # JWT
      APP_JWT_SECRET: your-jwt-secret-here
      APP_JWT_EXPIRATION: 86400000

      # Password reset
      APP_PASSWORD_RESET_FRONTEND_URL: http://localhost:4200/reset-password

      # Mail (Gmail)
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_USERNAME: your-email@gmail.com
      SPRING_MAIL_PASSWORD: your-gmail-app-password

      # Brevo SMTP
      BREVO_MAIL_HOST: smtp-relay.brevo.com
      BREVO_MAIL_PORT: 587
      BREVO_MAIL_USERNAME: your-brevo-username
      BREVO_MAIL_PASSWORD: your-brevo-password

      # Google Sign-In
      GOOGLE_CLIENT_ID: your-google-client-id

      # Face AI
      FACE_AI_BASE_URL: http://localhost:8001

      # Stripe
      STRIPE_SECRET_KEY: your-stripe-secret-key
      STRIPE_WEBHOOK_SECRET: your-stripe-webhook-secret
      CORE_STRIPE_SECRET_KEY: your-core-stripe-secret-key
      EVENT_STRIPE_SECRET_KEY: your-event-stripe-secret-key
      EVENT_STRIPE_PUBLIC_KEY: your-event-stripe-public-key
      RESERVATION_STRIPE_SECRET_KEY: your-reservation-stripe-secret-key
      RESERVATION_STRIPE_WEBHOOK_SECRET: your-reservation-stripe-webhook-secret

      # Groq AI
      GROQ_API_KEY: your-groq-api-key
      GROQ_CORRECTION_API_KEY: your-groq-correction-api-key
      FARAH_GROQ_API_KEY: your-farah-groq-api-key
      FARAH_GROQ_CORRECTION_API_KEY: your-farah-groq-correction-api-key
      MODERATION_AI_API_KEY: your-moderation-ai-api-key
      VISION_AI_API_KEY: your-vision-ai-api-key
      AI_GROQ_API_KEY: your-ai-groq-api-key

      # HuggingFace
      HUGGINGFACE_API_TOKEN: your-huggingface-api-token
      AI_HUGGINGFACE_API_KEY: your-ai-huggingface-api-key

      # Twilio
      TWILIO_ACCOUNT_SID: your-twilio-account-sid
      TWILIO_AUTH_TOKEN: your-twilio-auth-token
      TWILIO_PHONE_NUMBER: your-twilio-phone-number

      # Gemini
      GEMINI_API_KEY: your-gemini-api-key

      # Tavily
      TAVILY_API_KEY: your-tavily-api-key

      # Weather
      WEATHER_API_KEY: your-weather-api-key

  frontend:
    image: abderrazekchamekh/looking-frontend:v1
    container_name: looking-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data: